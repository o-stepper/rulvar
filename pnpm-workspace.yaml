# Workspace and shared external versions (docs/13, section "Package manager:
# pnpm 11.x workspaces"). Shared external versions are pinned once here via
# the catalog: protocol so the 14 package.json files cannot drift apart.
packages:
  - packages/*
  - examples
  - docs

# esbuild's postinstall only validates that the platform binary from its
# optionalDependencies matches the package version; allowing it keeps the
# vitepress/vite toolchain in docs/ working out of the box.
allowBuilds:
  esbuild: true

catalog:
  '@ai-sdk/google': ^4.0.24
  '@ai-sdk/provider': ^4.0.3
  '@anthropic-ai/sdk': ^0.115.0
  '@modelcontextprotocol/sdk': ^1.29.0
  '@arethetypeswrong/cli': ^0.18.5
  '@changesets/cli': ^2.31.1
  '@eslint/js': ^9.39.5
  '@types/estree': ^1.0.9
  '@types/node': ^22.20.1
  '@vitest/coverage-v8': ^4.1.10
  acorn: ^8.17.0
  arktype: ^2.2.3
  eslint: ^9.39.5
  fast-check: ^4.9.0
  openai: ^6.49.0
  prettier: ^3.9.6
  publint: ^0.3.22
  tsdown: ^0.22.14
  turbo: ^2.10.7
  typescript: ~6.0.3
  typescript-eslint: ^8.65.0
  valibot: ^1.4.2
  vitest: ^4.1.10
  zod: ^4.4.3

minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.63.0'
  - '@typescript-eslint/parser@8.63.0'
  - '@typescript-eslint/project-service@8.63.0'
  - '@typescript-eslint/scope-manager@8.63.0'
  - '@typescript-eslint/tsconfig-utils@8.63.0'
  - '@typescript-eslint/type-utils@8.63.0'
  - '@typescript-eslint/types@8.63.0'
  - '@typescript-eslint/typescript-estree@8.63.0'
  - '@typescript-eslint/utils@8.63.0'
  - '@typescript-eslint/visitor-keys@8.63.0'
  - '@vitest/coverage-v8@4.1.10'
  - '@vitest/expect@4.1.10'
  - '@vitest/mocker@4.1.10'
  - '@vitest/pretty-format@4.1.10'
  - '@vitest/runner@4.1.10'
  - '@vitest/snapshot@4.1.10'
  - '@vitest/spy@4.1.10'
  - '@vitest/utils@4.1.10'
  - typescript-eslint@8.63.0
  - vitest@4.1.10

# VitePress 1.6.4 is its own latest and pins vite ^5.4.14, and the vite 5
# line carries four unpatched dev-server advisories (one high): the repairs
# land in vite 6.4.3 and esbuild 0.25, so there is no upstream fix to wait
# for. Nothing here ships: neither package appears in any publishable
# `dependencies`, so the exposure is a developer running the docs dev
# server, never a library user. Scoped to vitepress's subtree on purpose,
# so the test runner's own vite is untouched; vite 6 pulls the patched
# esbuild itself. Drop this the day VitePress ships on vite 6 or newer.
overrides:
  vitepress>vite: '^6.4.3'
  # Dependabot floor bumps (2026-07-22). fast-uri and dompurify are patch
  # bumps inside their dependents' declared ranges (ajv, mermaid); the
  # @hono/node-server major sits OUTSIDE the MCP SDK's declared ^1.19.9
  # because the patched line is 2.x. Rulvar never loads the hono server
  # adapter (mcp() is a client; the inprocess transport uses the SDK's
  # in-memory wiring), so the override only keeps the vulnerable version
  # out of the tree; drop it when the SDK moves its own range.
  fast-uri: '^3.1.4'
  dompurify: '^3.4.12'
  '@hono/node-server': '^2.0.5'
  # Dependabot floor bumps (2026-08-11). js-yaml's !!omap quadratic-CPU
  # fix (CVE-2026-59870) landed separately on both major lines, and both
  # patched versions sit INSIDE their dependents' declared ranges
  # (read-yaml-file's ^3.6.1 under changesets; ^4 under @changesets/parse
  # and eslint's espree config). Both consumers are devDependencies; the
  # scoped floors only keep the vulnerable versions out of the tree.
  'js-yaml@^3.0.0': '^3.15.1'
  'js-yaml@^4.0.0': '^4.3.1'
  # Same sweep, from `pnpm audit` rather than the dependabot feed:
  # brace-expansion (both lines) moved by a plain in-range update, and
  # nanoid needs the floor because `pnpm update -r` does not reach a
  # transitive-only dependent (postcss declares ^3.3.16 and nothing in
  # the workspace depends on nanoid directly). All devDependency chains.
  'nanoid@^3.0.0': '^3.3.17'
  # tsdown is the .d.ts GENERATOR, and two artifacts are frozen against
  # the exact one that produced them: the committed dts-rollup baseline
  # and, hard, the published @rulvar/compat tarball (a published compat
  # version must repack byte identical). 0.22.14 only reindents JSDoc in
  # generated declarations, which is cosmetic and yet moves every one of
  # those bytes. Upgrading is therefore a deliberate act (refreeze the
  # baseline, cut a real compat release), never a drive-by minor, so the
  # resolution is pinned here while the catalog floor stays a caret.
  tsdown: '0.22.3'
